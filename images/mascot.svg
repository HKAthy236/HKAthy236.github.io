<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="樱花猫娘吉祥物">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffeef4"/>
    </linearGradient>
    <linearGradient id="tailG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe3ec"/>
      <stop offset="100%" stop-color="#ffd0e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#ffd6e4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd6e4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="200" cy="200" r="185" fill="url(#glow)"/>

  <!-- 地面阴影 -->
  <ellipse cx="200" cy="356" rx="96" ry="16" fill="#e9b8cc" opacity="0.35"/>

  <!-- 尾巴 -->
  <path d="M282 320 C332 312 348 268 326 232 C316 216 296 214 288 226 C280 238 292 246 302 244 C314 242 318 258 308 272 C298 286 272 296 256 300 Z"
        fill="url(#tailG)" stroke="#f3c3d5" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 身体 -->
  <path d="M200 214 C132 214 106 268 106 310 C106 344 144 356 200 356 C256 356 294 344 294 310 C294 268 268 214 200 214 Z"
        fill="url(#fur)" stroke="#f3c3d5" stroke-width="2.5"/>

  <!-- 前爪 -->
  <ellipse cx="164" cy="344" rx="24" ry="15" fill="#ffffff" stroke="#f3c3d5" stroke-width="2.5"/>
  <ellipse cx="236" cy="344" rx="24" ry="15" fill="#ffffff" stroke="#f3c3d5" stroke-width="2.5"/>
  <path d="M156 344 h16 M228 344 h16" stroke="#f3c3d5" stroke-width="2" stroke-linecap="round"/>

  <!-- 耳朵 -->
  <path d="M126 108 L104 34 L182 76 Z" fill="url(#fur)" stroke="#f3c3d5" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M132 96 L118 52 L166 78 Z" fill="#ffc2d1"/>
  <path d="M274 108 L296 34 L218 76 Z" fill="url(#fur)" stroke="#f3c3d5" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M268 96 L282 52 L234 78 Z" fill="#ffc2d1"/>

  <!-- 头 -->
  <circle cx="200" cy="164" r="94" fill="url(#fur)" stroke="#f3c3d5" stroke-width="2.5"/>

  <!-- 眼睛 -->
  <ellipse cx="163" cy="168" rx="17" ry="21" fill="#4a3b52"/>
  <ellipse cx="237" cy="168" rx="17" ry="21" fill="#4a3b52"/>
  <circle cx="157" cy="160" r="6.5" fill="#ffffff"/>
  <circle cx="231" cy="160" r="6.5" fill="#ffffff"/>
  <circle cx="169" cy="178" r="3" fill="#ffffff" opacity="0.75"/>
  <circle cx="243" cy="178" r="3" fill="#ffffff" opacity="0.75"/>

  <!-- 腮红 -->
  <ellipse cx="134" cy="196" rx="16" ry="9" fill="#ffb3c6" opacity="0.65"/>
  <ellipse cx="266" cy="196" rx="16" ry="9" fill="#ffb3c6" opacity="0.65"/>

  <!-- 鼻子与嘴 -->
  <path d="M200 186 l-7 8 h14 Z" fill="#ff8fab" stroke="#ff8fab" stroke-width="3" stroke-linejoin="round"/>
  <path d="M200 196 q-9 12 -19 4 M200 196 q9 12 19 4" fill="none" stroke="#8a7280" stroke-width="3" stroke-linecap="round"/>

  <!-- 胡须 -->
  <path d="M112 168 h-30 M112 182 l-28 8 M288 168 h30 M288 182 l28 8"
        stroke="#e2b7c8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 耳饰：樱花 -->
  <g transform="translate(286,92)">
    <g fill="#ffa8be">
      <ellipse cx="0" cy="-14" rx="8" ry="12"/>
      <ellipse cx="13" cy="-4" rx="8" ry="12" transform="rotate(72 13 -4)"/>
      <ellipse cx="8" cy="12" rx="8" ry="12" transform="rotate(144 8 12)"/>
      <ellipse cx="-8" cy="12" rx="8" ry="12" transform="rotate(216 -8 12)"/>
      <ellipse cx="-13" cy="-4" rx="8" ry="12" transform="rotate(288 -13 -4)"/>
    </g>
    <circle cx="0" cy="0" r="5.5" fill="#ffd166"/>
  </g>

  <!-- 飘落花瓣 -->
  <g fill="#ffc2d1" opacity="0.9">
    <ellipse cx="62" cy="128" rx="7" ry="11" transform="rotate(-25 62 128)"/>
    <ellipse cx="342" cy="188" rx="6" ry="10" transform="rotate(35 342 188)"/>
    <ellipse cx="88" cy="268" rx="6" ry="9" transform="rotate(15 88 268)"/>
    <ellipse cx="318" cy="316" rx="7" ry="11" transform="rotate(-40 318 316)"/>
  </g>
</svg>
